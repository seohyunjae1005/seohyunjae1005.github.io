name: Daily semiconductor news update

on:
  schedule:
    # GitHub cron은 UTC 기준: 22:00 UTC = 다음 날 07:00 KST
    - cron: "0 22 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/daily-update.yml
      - config/sources.yaml
      - scripts/fetch_*_news.py
      - scripts/run_daily_collection.py
      - src/trend_tracker/asml.py
      - src/trend_tracker/samsung_archive.py
      - src/trend_tracker/lam_research.py

permissions:
  contents: write

concurrency:
  group: repository-data-updates
  cancel-in-progress: false

jobs:
  collect-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Validate job classification rules
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -v

      - name: Collect official newsroom feeds
        run: python scripts/run_daily_collection.py

      - name: Record company collection health
        if: always()
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          path = Path('data/processed/latest_semiconductor_news.json')
          if path.exists():
              rows = json.loads(path.read_text())['collection_sources']
              with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as output:
                  output.write('### Company news collection\n\n| Company | Status | Latest published |\n| --- | --- | --- |\n')
                  for row in rows:
                      output.write(f"| {row['company']} | {row['status']} | {row['latest_published_at'] or 'none'} |\n")
          PY

      - name: Translate new articles within the free quota
        env:
          DEEPL_API_KEY: ${{ secrets.DEEPL_API_KEY }}
        run: python scripts/translate_articles.py

      - name: Extract representative public official articles
        run: python scripts/extract_article_bodies.py

      - name: Prepare only new evidence-grounded analysis requests
        run: python scripts/build_analysis_requests.py

      - name: Analyze at most three new articles with Gemini
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ANALYSIS_MAX_ARTICLES: "3"
          ANALYSIS_FAIL_ON_ALL_ERRORS: "0"
        run: python scripts/analyze_sample_articles.py

      - name: Preserve machine-validated company analyses
        run: python scripts/merge_analysis_cache.py

      - name: Build public website data
        run: python scripts/build_site.py

      - name: Refresh the 7-, 30- and 90-day AI trend reports
        continue-on-error: true
        timeout-minutes: 8
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python scripts/analyze_monthly_trend.py

      - name: Refresh industry briefing from primary sources
        continue-on-error: true
        timeout-minutes: 6
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python scripts/build_industry_briefing.py

      - name: Build public privacy-safe email digests
        run: |
          DIGEST_DAYS=1 DIGEST_OUTPUT_PATH=docs/newsletter/daily.html DIGEST_META_PATH=docs/newsletter/daily.json python scripts/build_email_digest.py
          DIGEST_DAYS=7 DIGEST_OUTPUT_PATH=docs/newsletter/weekly.html DIGEST_META_PATH=docs/newsletter/weekly.json python scripts/build_email_digest.py

      - name: Commit updated website data
        run: |
          if git diff --quiet -- docs/data docs/newsletter data/translations/ko.json data/analysis/validated_cache.json data/analysis/monthly_trend_cache.json; then
            echo "No website data changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data docs/newsletter data/translations/ko.json data/analysis/validated_cache.json data/analysis/monthly_trend_cache.json
          git commit -m "Update daily semiconductor news"
          git pull --rebase origin main
          git push
