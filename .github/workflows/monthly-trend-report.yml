name: Monthly process job trend report

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/monthly-trend-report.yml

permissions:
  contents: write

concurrency:
  group: repository-data-updates
  cancel-in-progress: false

jobs:
  analyze-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build one evidence-grounded process job report
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python scripts/analyze_monthly_trend.py

      - name: Commit validated monthly report
        run: |
          if git diff --quiet -- docs/data/latest.json data/analysis/monthly_trend_cache.json; then
            echo "No monthly trend changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data/latest.json data/analysis/monthly_trend_cache.json
          git commit -m "Update monthly process job trend report"
          git pull --rebase origin main
          git push

      - name: Upload validation notes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: monthly-trend-validation
          path: runtime/monthly_trend_validation.md
          if-no-files-found: warn
          retention-days: 7
